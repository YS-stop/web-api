<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TwitCanva</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      /*
       * 焦点环颜色令牌。
       * 默认值为深色主题（画布）的紫罗兰色；浅色管理页面在各自根容器上覆盖 --focus-ring，
       * 即可完成主题切换，无需改动全局规则本身。
       * 例：.drama-projects-page { --focus-ring: #4558dc; }
       */
      --focus-ring: #a78bfa;
      --focus-ring-offset: 2px;
    }

    * { box-sizing: border-box; }

    ::selection { background: rgba(139, 92, 246, .42); color: #fff; }
    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0b0b12;
    }

    ::-webkit-scrollbar-thumb {
      background: #343247;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #706a93;
    }

    body {
      background-color: #0b0b12;
      color: #e5e5e5;
      overflow: hidden;
      /* Prevent body scroll, handle in canvas */
    }

    button, input { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--focus-ring, #a78bfa);
      outline-offset: var(--focus-ring-offset, 2px);
    }

    /* Hide native number input spinners (we provide our own +/- buttons) */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
